services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: taskdb_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tasknet_dev

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: taskcache_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    networks:
      - tasknet_dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  tasknet_dev:
    driver: bridge
